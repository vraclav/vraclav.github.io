<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varianty prohlídky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,600&family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f2eee6;
    --ink: #2b2620;
    --ink-soft: #6b6154;
    --gold: #b8873b;
    --gold-deep: #8c6425;
    --fresh: #3e7c6b;
    --fresh-deep: #2c5c4f;
    --line: rgba(43,38,32,0.12);
    --radius: 18px;
    --danger: #b5453c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero-bg {
    position: relative;
    width: 100%;
    height: 34vh;
    min-height: 220px;
    max-height: 380px;
    overflow: hidden;
  }

  .hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('img/background.jpg');
    background-size: cover;
    background-position: center 60%;
  }

  .hero-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(242,238,230,0) 0%, rgba(242,238,230,0.55) 55%, var(--bg) 100%);
  }

  body {
    min-height: 100svh;
    margin: 0;
    display: block;
  }

  .page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 56px;
  }

  header {
    text-align: center;
    margin-top: -64px;
    position: relative;
    z-index: 2;
    margin-bottom: 32px;
  }

  .logo {
    height: 64px;
    width: auto;
    margin: 0 auto 18px;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(43,38,32,0.25));
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1 {
    font-weight: 600;
    font-size: clamp(24px, 4vw, 36px);
    margin: 0 0 8px;
    line-height: 1.05;
  }

  .subtext {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Cards ---- */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    position: relative;
    height: 380px;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.66) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.08) 100%);
  }

  .card-content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px;
    color: #fff;
  }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .card-baroque .card-photo {
    background-color: #4a3a22;
    background-image:
      linear-gradient(to top, rgba(20,14,5,0.15), rgba(20,14,5,0) 40%),
      url('img/barokni_areal.jpg');
  }
  .card-baroque .card-tag { background: rgba(184,135,59,0.9); color: #2b2013; }
  .card-baroque .card-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    margin: 0 0 4px;
  }
  .flourish {
    position: absolute;
    bottom: 90px;
    right: 16px;
    width: 40px;
    height: 40px;
    opacity: 0.7;
    z-index: 1;
  }

  .card-modern .card-photo {
    background-color: #1f4a40;
    background-image:
      linear-gradient(to top, rgba(10,20,17,0.15), rgba(10,20,17,0) 40%),
      url('img/detske_skupiny.png');
  }
  .card-modern .card-tag { background: rgba(62,124,107,0.9); color: #eefaf6; }
  .card-modern .card-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.15;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .blob {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 120px;
    height: 120px;
    border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
    background: rgba(255,255,255,0.10);
    z-index: 1;
  }

  .card-sub {
    font-size: 13px;
    opacity: 0.85;
    margin: 0;
  }

  /* ---- Controls row: Ano/Ne + time ---- */
  .card-controls {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .yn-toggle {
    display: inline-flex;
    padding: 3px;
    background: rgba(255,255,255,0.92);
    border-radius: 999px;
  }

  .yn-btn {
    appearance: none;
    border: none;
    background: transparent;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .yn-btn svg { width: 15px; height: 15px; }

  .yn-yes svg { stroke: var(--fresh-deep); }
  .yn-no svg { stroke: var(--danger); }

  .yn-btn.active.yn-yes { background: var(--fresh-deep); }
  .yn-btn.active.yn-yes svg { stroke: #fff; }

  .yn-btn.active.yn-no { background: var(--danger); }
  .yn-btn.active.yn-no svg { stroke: #fff; }

  .card-time {
    display: inline-flex;
    padding: 3px;
    background: rgba(255,255,255,0.92);
    border-radius: 999px;
  }

  .card-time[hidden] { display: none; }

  .card-time-btn {
    appearance: none;
    border: none;
    background: transparent;
    padding: 7px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card-time-btn.active {
    background: var(--ink);
    color: #fff;
  }

  /* ---- Submit area ---- */
  .submit-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 28px;
  }

  .submit-warning {
    font-size: 13px;
    color: var(--danger);
    min-height: 18px;
    text-align: center;
  }

  .submit-btn {
    appearance: none;
    border: none;
    padding: 14px 36px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--fresh-deep));
    transition: opacity 0.2s ease, transform 0.15s ease;
  }

  .submit-btn:active { transform: scale(0.98); }

  .submit-btn:disabled {
    background: #cfc9bd;
    cursor: not-allowed;
  }

  /* ---- Thank you state ---- */
  .thankyou {
    display: none;
    text-align: center;
    padding: 70px 20px;
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }

  .thankyou.visible {
    display: block;
    animation: fadeUp 0.5s ease both;
  }

  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--fresh-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }

  .check svg { width: 26px; height: 26px; }

  .thankyou h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
  }

  .thankyou p {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="hero-bg"></div>

<div class="page">
  <header>
    <img src="img/logo.png" alt="Znak obce" class="logo">
    <div class="eyebrow">Hlasování · výběr prohlídky</div>
    <h1>Vyberte varianty prohlídky</h1>
    <p class="subtext">U každého místa zvolte Ano nebo Ne. Při Ano zvolte i čas.</p>
  </header>

  <div class="cards" id="cards">
    <div class="card card-baroque" data-location="Barokní areál Vraclav" data-form-value="Barokni areal">
      <div class="card-photo"></div>
      <div class="card-overlay"></div>
      <svg class="flourish" viewBox="0 0 48 48" fill="none">
        <path d="M4 24c8 0 8-16 20-16M44 24c-8 0-8 16-20 16M24 4c0 8 16 8 16 20M24 44c0-8-16-8-16-20" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>

      <div class="card-controls">
        <div class="yn-toggle" role="group" aria-label="Chcete hlasovat pro Barokní areál Vraclav?">
          <button type="button" class="yn-btn yn-yes" data-choice="yes" aria-label="Ano" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="yn-btn yn-no active" data-choice="no" aria-label="Ne" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke-width="3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="card-time" hidden>
          <button type="button" class="card-time-btn active" data-time="14:30">14:30</button>
          <button type="button" class="card-time-btn" data-time="15:00">15:00</button>
        </div>
      </div>

      <div class="card-content">
        <span class="card-tag">Historické místo</span>
        <p class="card-title">Barokní areál Vraclav</p>
      </div>
    </div>

    <div class="card card-modern" data-location="Budova dětských skupin" data-form-value="Detske skupiny">
      <div class="card-photo"></div>
      <div class="card-overlay"></div>
      <div class="blob"></div>

      <div class="card-controls">
        <div class="yn-toggle" role="group" aria-label="Chcete hlasovat pro budovu dětských skupin?">
          <button type="button" class="yn-btn yn-yes" data-choice="yes" aria-label="Ano" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="yn-btn yn-no active" data-choice="no" aria-label="Ne" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke-width="3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="card-time" hidden>
          <button type="button" class="card-time-btn active" data-time="14:30">14:30</button>
          <button type="button" class="card-time-btn" data-time="15:00">15:00</button>
        </div>
      </div>

      <div class="card-content">
        <span class="card-tag">Moderní zázemí</span>
        <p class="card-title">Budova dětských skupin</p>
      </div>
    </div>
  </div>

  <div class="submit-area" id="submitArea">
    <div class="submit-warning" id="submitWarning"></div>
    <button type="button" class="submit-btn" id="submitBtn" disabled>Odeslat hlas</button>
  </div>

  <div class="thankyou" id="thankyou">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Děkujeme za Váš hlas!</h2>
    <p id="thankyouDetail"></p>
  </div>
</div>

<!-- Skrytý iframe jako cíl odeslání formuláře, aby nedošlo k přesměrování stránky -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
  // ============================================================
  // KONFIGURACE
  // ============================================================
  const FORM_ACTION_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSeLQ8SlUt9tZTSCq7qrz9aAPC1a0CkpMdR9BXVs3jkGEDJBtg/formResponse";
  const ENTRY_MULTICHOICE = "entry.341589083"
  // ============================================================

  const cardEls = Array.from(document.querySelectorAll(".card"));
  const state = cardEls.map(() => ({ choice: "no", time: "14:30" }));

  const submitBtn = document.getElementById("submitBtn");
  const submitWarning = document.getElementById("submitWarning");
  const submitArea = document.getElementById("submitArea");
  const cardsWrap = document.getElementById("cards");
  const thankyou = document.getElementById("thankyou");
  const thankyouDetail = document.getElementById("thankyouDetail");

  cardEls.forEach((card, idx) => {
    const ynButtons = card.querySelectorAll(".yn-btn");
    const timeWrap = card.querySelector(".card-time");
    const timeButtons = card.querySelectorAll(".card-time-btn");
    const subText = card.querySelector(".card-sub");

    ynButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        ynButtons.forEach(b => { b.classList.remove("active"); b.setAttribute("aria-pressed", "false"); });
        btn.classList.add("active");
        btn.setAttribute("aria-pressed", "true");

        state[idx].choice = btn.dataset.choice;
        const isYes = state[idx].choice === "yes";

        // --- NOVÁ FUNKCIONALITA: Automatické nastavení času ---
        if (isYes) {
          // Identifikace indexu druhé karty (pokud je tahle 0, druhá je 1 a naopak)
          const otherIdx = idx === 0 ? 1 : 0; 
          
          if (state[otherIdx].choice === "yes") {
            // Zjištění času druhé karty a nastavení opačného času pro tuto kartu
            state[idx].time = state[otherIdx].time === "14:30" ? "15:00" : "14:30";

            // Vizuální přepnutí aktivní třídy na správné časové tlačítko
            timeButtons.forEach(tb => {
              tb.classList.remove("active");
              if (tb.dataset.time === state[idx].time) {
                tb.classList.add("active");
              }
            });
          }
        }
        // --------------------------------------------------------

        timeWrap.hidden = !isYes;
        
        if(subText) {
            subText.textContent = isYes ? `Vybráno · ${state[idx].time}` : "Nehlasujete pro toto místo";
        }

        validate();
      });
    });

    timeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        timeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state[idx].time = btn.dataset.time;
        
        if(subText) {
            subText.textContent = `Vybráno · ${state[idx].time}`;
        }
        validate();
      });
    });
  });

    timeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        timeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state[idx].time = btn.dataset.time;
        
        if(subText) {
            subText.textContent = `Vybráno · ${state[idx].time}`;
        }
        validate();
      });
    });
  });

  function validate() {
    const yesEntries = state.filter(s => s.choice === "yes");
    let valid = yesEntries.length > 0;
    let message = "";

    if (yesEntries.length === 2 && yesEntries[0].time === yesEntries[1].time) {
      valid = false;
      message = "Pro obě místa nelze zvolit stejný čas — zvolte prosím různé časy.";
    }

    submitWarning.textContent = message;
    submitBtn.disabled = !valid;
  }

  submitBtn.addEventListener("click", () => {
    const chosenValues = [];
    const chosenSummaries = [];

    cardEls.forEach((card, idx) => {
      const s = state[idx];
      if (s.choice === "yes") {
        // Generování formátu ba1430, ds1500 atd.
        const prefix = card.dataset.location.includes("Barokní") ? "ba" : "ds";
        const timeCode = s.time.replace(":", ""); // odstraní dvojtečku: "14:30" -> "1430"
        const finalValue = prefix + timeCode;

        chosenValues.push(finalValue);
        chosenSummaries.push(`${card.dataset.location} · ${s.time}`);
      }
    });

    // Odeslání všech vybraných hodnot najednou
    submitVote(chosenValues);

    cardsWrap.style.display = "none";
    submitArea.style.display = "none";
    thankyouDetail.textContent = chosenSummaries.join(" · ");
    thankyou.classList.add("visible");
  });

  function submitVote(values) {
    const form = document.createElement("form");
    form.action = FORM_ACTION_URL;
    form.method = "POST";
    form.target = "hidden_iframe";
    form.style.display = "none";

    // Pro multichoice otázku vytvoříme input pro každou zvolenou variantu
    // Všechny musí mít stejný 'name' (ID otázky)
    values.forEach(val => {
      const input = document.createElement("input");
      input.name = ENTRY_MULTICHOICE;
      input.value = val;
      form.appendChild(input);
    });

    // Skrytá pole vyžadovaná Google Formuláři
    const metaFields = {
      "fvv": "1",
      "pageHistory": "0",
      "fbzx": String(Date.now())
    };

    Object.entries(metaFields).forEach(([name, value]) => {
      const input = document.createElement("input");
      input.name = name;
      input.value = value;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
  }
</script>

</body>
</html>
