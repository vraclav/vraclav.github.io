<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varianty prohlídky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,600&family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/background.webp" fetchpriority="high">
<link rel="preload" as="image" href="img/barokni_areal.webp">
<link rel="preload" as="image" href="img/detske_skupiny.webp">

<style>
  :root {
    --bg: #f2eee6;
    --ink: #2b2620;
    --ink-soft: #6b6154;
    --gold: #b8873b;
    --gold-deep: #8c6425;
    --fresh: #3e7c6b;
    --fresh-deep: #2c5c4f;
    --line: rgba(43,38,32,0.12);
    --radius: 18px;
    --danger: #b5453c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero-bg {
    position: relative;
    width: 100%;
    height: 34vh;
    min-height: 220px;
    max-height: 380px;
    overflow: hidden;
  }

  .hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('img/background.webp');
    background-size: cover;
    background-position: center 60%;
  }

  .hero-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(242,238,230,0) 0%, rgba(242,238,230,0.55) 55%, var(--bg) 100%);
  }

  body {
    min-height: 100svh;
    margin: 0;
    display: block;
  }

  .page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 56px;
  }

  header {
    text-align: center;
    margin-top: -64px;
    position: relative;
    z-index: 2;
    margin-bottom: 32px;
  }

  .logo {
    height: 64px;
    width: auto;
    margin: 0 auto 18px;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(43,38,32,0.25));
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1 {
    font-weight: 600;
    font-size: clamp(24px, 4vw, 36px);
    margin: 0 0 8px;
    line-height: 1.05;
  }

  .subtext {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Cards ---- */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    position: relative;
    height: 380px;
    border-radius: var(--radius);
    overflow: hidden;
    contain: layout paint;
  }

  .card-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.3s ease;
    will-change: opacity;
  }

  .card-inactive .card-photo {
  opacity: 0.45;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.66) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.08) 100%);
  }

  .card-content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px;
    color: #fff;
  }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .card-baroque .card-photo {
    background-color: #4a3a22;
    background-image:
      linear-gradient(to top, rgba(20,14,5,0.15), rgba(20,14,5,0) 40%),
      url('img/barokni_areal.webp');
  }
  .card-baroque .card-tag { background: rgba(184,135,59,0.9); color: #2b2013; }
  .card-baroque .card-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    margin: 0 0 4px;
  }

  .card {
    cursor: pointer;
    user-select: none;
  }
  
  .flourish {
    position: absolute;
    bottom: 90px;
    right: 16px;
    width: 40px;
    height: 40px;
    opacity: 0.7;
    z-index: 1;
  }

  .card-modern .card-photo {
    background-color: #1f4a40;
    background-image:
      linear-gradient(to top, rgba(10,20,17,0.15), rgba(10,20,17,0) 40%),
      url('img/detske_skupiny.webp');
  }
  .card-modern .card-tag { background: rgba(62,124,107,0.9); color: #eefaf6; }
  .card-modern .card-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.15;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .blob {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 120px;
    height: 120px;
    border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
    background: rgba(255,255,255,0.10);
    z-index: 1;
  }

  .card-sub {
    font-size: 13px;
    opacity: 0.85;
    margin: 0;
  }

  /* ---- Controls row: Ano/Ne + time ---- */
  .card-controls {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

.interest-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 12px;
  background: rgba(255,255,255,0.92);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.interest-check {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.checkmark {
  position: relative;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--ink-soft);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.checkmark::before {
  content: "";
  position: absolute;
  inset: -2px; /* pokryje i okraj */
  border-radius: 50%;
  background: var(--fresh-deep);
  border: 2px solid var(--fresh-deep);
  opacity: 0;
  transition: opacity 0.15s ease;
  will-change: opacity;
  z-index: 0;
}

.checkmark svg {
  position: relative;
  z-index: 1;
  width: 14px;
  height: 14px;
  stroke: #fff;
  stroke-width: 3;
  fill: none;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.15s ease, transform 0.15s ease;
  will-change: opacity, transform;
}

.interest-check:checked + .checkmark::before {
  opacity: 1;
}
.interest-check:checked + .checkmark svg {
  opacity: 1;
  transform: scale(1);
}

.interest-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
  
  .card-time {
    display: inline-flex;
    padding: 3px;
    background: rgba(255,255,255,0.92);
    border-radius: 999px;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    will-change: opacity, transform; /* hardwarová akcelerace */
  }

  .card-time.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .card-time-btn {
    appearance: none;
    border: none;
    background: transparent;
    padding: 9px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .card-time-btn.active {
    background: var(--ink);
    color: #fff;
  }

  /* ---- Submit area ---- */
  .submit-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 28px;
  }

  .submit-warning {
    font-size: 13px;
    color: var(--danger);
    min-height: 18px;
    text-align: center;
  }

  .submit-btn {
    appearance: none;
    border: none;
    padding: 14px 36px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--fresh-deep));
    transition: opacity 0.2s ease, transform 0.15s ease;
  }

  .submit-btn:active { transform: scale(0.98); }

  .submit-btn:disabled {
    background: #cfc9bd;
    cursor: not-allowed;
  }

  /* ---- Thank you state ---- */
  .thankyou {
    display: none;
    text-align: center;
    padding: 70px 20px;
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }

  .thankyou.visible {
    display: block;
    animation: fadeUp 0.5s ease both;
  }

  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--fresh-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }

  .check svg { width: 26px; height: 26px; }

  .thankyou h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
  }

  .thankyou p {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="hero-bg"></div>

<div class="page">
  <header>
    <img src="img/logo.webp" alt="Znak obce" class="logo">
    <div class="eyebrow">Hlasování · výběr prohlídky</div>
    <h1>Vyberte varianty prohlídky</h1>
    <p class="subtext">Označte místo a čas prohlídky.</p>
  </header>

  <div class="cards" id="cards">
    <div class="card card-baroque card-inactive" data-location="Barokní areál Vraclav" data-form-value="Barokni areal">
      <div class="card-photo"></div>
      <div class="card-overlay"></div>
      <svg class="flourish" viewBox="0 0 48 48" fill="none">
        <path d="M4 24c8 0 8-16 20-16M44 24c-8 0-8 16-20 16M24 4c0 8 16 8 16 20M24 44c0-8-16-8-16-20" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>

      <div class="card-controls">
        <label class="interest-toggle">
          <input type="checkbox" class="interest-check" aria-label="Mám zájem o Barokní areál Vraclav">
          <span class="checkmark"></span>
          <span class="interest-label">Mám zájem</span>
        </label>
        <div class="card-time">
          <button type="button" class="card-time-btn active" data-time="14:30">14:30</button>
          <button type="button" class="card-time-btn" data-time="15:00">15:00</button>
        </div>
      </div>

      <div class="card-content">
        <span class="card-tag">Historické místo</span>
        <p class="card-title">Barokní areál Vraclav</p>
      </div>
    </div>

    <div class="card card-modern card-inactive" data-location="Budova dětských skupin" data-form-value="Detske skupiny">
      <div class="card-photo"></div>
      <div class="card-overlay"></div>
      <div class="blob"></div>

      <div class="card-controls">
        <label class="interest-toggle">
          <input type="checkbox" class="interest-check" aria-label="Mám zájem o budovu dětských skupin">
          <span class="checkmark"></span>
          <span class="interest-label">Mám zájem</span>
        </label>
        <div class="card-time">
          <button type="button" class="card-time-btn active" data-time="14:30">14:30</button>
          <button type="button" class="card-time-btn" data-time="15:00">15:00</button>
        </div>
      </div>

      <div class="card-content">
        <span class="card-tag">Moderní zázemí</span>
        <p class="card-title">Budova dětských skupin</p>
      </div>
    </div>
  </div>

  <div class="submit-area" id="submitArea">
    <div class="submit-warning" id="submitWarning"></div>
    <button type="button" class="submit-btn" id="submitBtn" disabled>Odeslat hlas</button>
  </div>

  <div class="thankyou" id="thankyou">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Děkujeme!</h2>
    <p id="thankyouDetail"></p>
  </div>
</div>

<script>
  // ============================================================
  // KONFIGURACE
  // ============================================================
  const FORM_ACTION_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSeLQ8SlUt9tZTSCq7qrz9aAPC1a0CkpMdR9BXVs3jkGEDJBtg/formResponse";
  const ENTRY_MULTICHOICE = "entry.341589083"
  // ============================================================

  const cardEls = Array.from(document.querySelectorAll(".card"));
  const state = cardEls.map(() => ({ interested: false, time: "14:30" }));

  const submitBtn = document.getElementById("submitBtn");
  const submitWarning = document.getElementById("submitWarning");
  const submitArea = document.getElementById("submitArea");
  const cardsWrap = document.getElementById("cards");
  const thankyou = document.getElementById("thankyou");
  const thankyouDetail = document.getElementById("thankyouDetail");

  cardEls.forEach((card, idx) => {
  const checkbox = card.querySelector(".interest-check");
  const timeWrap = card.querySelector(".card-time");
  const timeButtons = card.querySelectorAll(".card-time-btn");
  const subText = card.querySelector(".card-sub");

    card.addEventListener('click', (e) => {
    if (e.target.closest('.card-time')) return;
    if (e.target.closest('.interest-toggle')) return;
    
    checkbox.checked = !checkbox.checked;
    checkbox.dispatchEvent(new Event('change'));
  });

  checkbox.addEventListener("change", () => {
    state[idx].interested = checkbox.checked;

    card.classList.toggle('card-inactive', !checkbox.checked);

    // Zobrazit/skrýt čas
    timeWrap.classList.toggle('visible', checkbox.checked);

    // Pokud je zájem a druhá karta je také vybrána, nastavíme odlišný čas
    if (checkbox.checked) {
      const otherIdx = idx === 0 ? 1 : 0;
      if (state[otherIdx].interested) {
        state[idx].time = state[otherIdx].time === "14:30" ? "15:00" : "14:30";
        // Aktualizovat aktivní časové tlačítko
        timeButtons.forEach(tb => {
          tb.classList.remove("active");
          if (tb.dataset.time === state[idx].time) {
            tb.classList.add("active");
          }
        });
      }
    }

    // Aktualizovat text pod názvem
    if (subText) {
      subText.textContent = checkbox.checked ? `Vybráno · ${state[idx].time}` : "Nehlasujete pro toto místo";
    }

    validate();
  });

  timeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      timeButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[idx].time = btn.dataset.time;

      if (subText) {
        subText.textContent = `Vybráno · ${state[idx].time}`;
      }
      validate();
    });
  });
});

function validate() {
  const interested = state.filter(s => s.interested);
  let valid = interested.length > 0;
  let message = "";

  if (interested.length === 2 && interested[0].time === interested[1].time) {
    valid = false;
    message = "Pro obě místa nelze zvolit stejný čas — zvolte prosím různé časy.";
  }

  submitWarning.textContent = message;
  submitBtn.disabled = !valid;
}

submitBtn.addEventListener("click", async () => {
  const chosenValues = [];
  const chosenSummaries = [];

  cardEls.forEach((card, idx) => {
    const s = state[idx];
    if (s.interested) {
      const prefix = card.dataset.location.includes("Barokní") ? "ba" : "ds";
      const timeCode = s.time.replace(":", "");
      const finalValue = prefix + timeCode;
      chosenValues.push(finalValue);
      chosenSummaries.push(`${card.dataset.location} · ${s.time}`);
    }
  });

  submitBtn.disabled = true;
  submitBtn.textContent = "Odesílám…";
  submitWarning.textContent = "";

  await submitVote(chosenValues);

  cardsWrap.style.display = "none";
  submitArea.style.display = "none";
  thankyouDetail.textContent = chosenSummaries.join(" · ");
  thankyou.classList.add("visible");
});

  function buildParams(values) {
    const params = new URLSearchParams();
    values.forEach(val => params.append(ENTRY_MULTICHOICE, val));
    params.append("fvv", "1");
    params.append("pageHistory", "0");
    params.append("fbzx", String(Date.now()));
    return params;
  }

  // Odeslání hlasu VÍCE nezávislými cestami zároveň. Důvod: některé ad-blockery /
  // privacy prohlížeče / síťové filtry (AdGuard, NextDNS, Brave Shields, Samsung
  // Internet…) blokují requesty na docs.google.com/forms/.../formResponse jako
  // "tracker" - typicky jen konkrétní typ requestu (fetch/XHR/beacon), ale klasickou
  // navigaci přes <form> nechají projít, nebo naopak. Posláním všemi cestami zároveň
  // maximalizujeme šanci, že aspoň jedna projde. Kvůli cross-origin/no-cors navíc
  // nikdy nejde se 100% jistotou zjistit, že se odpověď zapsala - proto tenhle přístup.
  async function submitVote(values) {
    const params = buildParams(values);

    try {
      // Zkusíme standardní fetch. Ad-blockery a privacy štíty (např. Brave)
      // obvykle request zaříznou hned na začátku, což způsobí, že Promise vyhodí chybu.
      await fetch(FORM_ACTION_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });
      // Pokud kód dojde sem, fetch prošel (síťový požadavek se úspěšně odeslal).
      console.log("Odesláno úspěšně přes fetch.");
    } catch (err) {
      // Zde skončíme, pokud např. uBlock Origin nebo Brave Shield zablokuje URL.
      // Teprve v tomto případě spustíme "tvrdou" formulářovou navigaci přes iframe.
      console.warn("Fetch byl zablokován klientem, zkouším záložní iframe fallback.", err);
      try {
        submitViaHiddenForm(values);
      } catch (fallbackErr) {
        console.error("I záložní iframe selhal.", fallbackErr);
      }
    }

    // Dát prohlížeči chvilku na zpracování, než ukážeme "Děkujeme"
    return new Promise(resolve => setTimeout(resolve, 600));
  }

  function submitViaHiddenForm(values) {
    let iframe = document.getElementById("hidden_iframe");
    if (!iframe) {
      iframe = document.createElement("iframe");
      iframe.name = "hidden_iframe";
      iframe.id = "hidden_iframe";
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }

    const form = document.createElement("form");
    form.action = FORM_ACTION_URL;
    form.method = "POST";
    form.target = "hidden_iframe";
    form.style.display = "none";

    values.forEach(val => {
      const input = document.createElement("input");
      input.name = ENTRY_MULTICHOICE;
      input.value = val;
      form.appendChild(input);
    });

    const metaFields = { fvv: "1", pageHistory: "0", fbzx: String(Date.now()) };
    Object.entries(metaFields).forEach(([name, value]) => {
      const input = document.createElement("input");
      input.name = name;
      input.value = value;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 1000);
  }
</script>

</body>
</html>
